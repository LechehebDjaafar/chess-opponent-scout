<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#15110D"/>
      <stop offset="55%" stop-color="#1C1712"/>
      <stop offset="100%" stop-color="#1C1712"/>
    </linearGradient>
    <radialGradient id="pawn-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#C9A66B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9A66B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pawn-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7C793"/>
      <stop offset="100%" stop-color="#A8814F"/>
    </linearGradient>
    <pattern id="board" width="52" height="52" patternUnits="userSpaceOnUse">
      <rect width="52" height="52" fill="none"/>
      <rect width="26" height="26" fill="#EDE6D6" opacity="0.035"/>
      <rect x="26" y="26" width="26" height="26" fill="#EDE6D6" opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" fill="url(#bg-fade)"/>
  <rect width="1600" height="420" fill="url(#board)"/>

  <!-- glow behind pawn -->
  <circle cx="235" cy="205" r="230" fill="url(#pawn-glow)"/>

  <!-- pawn silhouette (echoes the extension icon) -->
  <g transform="translate(235,205)">
    <circle cx="0" cy="-95" r="46" fill="url(#pawn-fill)"/>
    <path d="M -38 -18 L 38 -18 L 58 58 L -58 58 Z" fill="url(#pawn-fill)"/>
    <rect x="-72" y="58" width="144" height="26" rx="4" fill="url(#pawn-fill)"/>
  </g>

  <!-- hairline divider, matches the panel header style -->
  <line x1="430" y1="118" x2="1500" y2="118" stroke="#3B3020" stroke-width="1.5"/>

  <text x="430" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#EDE6D6">Chess Opponent Scout</text>

  <text x="1500" y="235" font-family="Tahoma, Arial, sans-serif" font-size="26" fill="#C9A66B" text-anchor="end">اعرف خصمك… قبل أن تُلعب النقلة الأولى</text>

  <!-- feature pills -->
  <g font-family="Tahoma, Arial, sans-serif" font-size="16" fill="#EDE6D6">
    <g transform="translate(1500,278)" text-anchor="end">
      <rect x="-288" y="-25" width="288" height="40" rx="6" fill="#241E16" stroke="#3B3020"/>
      <text x="-24" y="2" text-anchor="end">رصد الساعة لحظياً</text>
    </g>
    <g transform="translate(1192,278)" text-anchor="end">
      <rect x="-386" y="-25" width="386" height="40" rx="6" fill="#241E16" stroke="#3B3020"/>
      <text x="-24" y="2" text-anchor="end">إحصائيات آخر 100 مباراة</text>
    </g>
    <g transform="translate(786,278)" text-anchor="end">
      <rect x="-274" y="-25" width="274" height="40" rx="6" fill="#241E16" stroke="#3B3020"/>
      <text x="-24" y="2" text-anchor="end">قراءة حالة الخصم</text>
    </g>
  </g>
</svg>
