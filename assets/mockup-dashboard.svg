<svg width="1000" height="680" viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="squares" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="72" height="72" fill="#2A2521"/>
      <rect width="36" height="36" fill="#332C25"/>
      <rect x="36" y="36" width="36" height="36" fill="#332C25"/>
    </pattern>
    <linearGradient id="win-loss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C9473"/>
      <stop offset="0.58" stop-color="#7C9473"/>
      <stop offset="0.58" stop-color="#A79C87"/>
      <stop offset="0.72" stop-color="#A79C87"/>
      <stop offset="0.72" stop-color="#B0554A"/>
      <stop offset="1" stop-color="#B0554A"/>
    </linearGradient>
  </defs>

  <!-- generic page backdrop, evokes "a chess site" without copying any real site's UI -->
  <rect width="1000" height="680" fill="url(#squares)"/>
  <rect width="1000" height="680" fill="#15120F" opacity="0.35"/>

  <!-- floating panel -->
  <g>
    <rect x="574" y="52" width="400" height="600" rx="10" fill="#000000" opacity="0.35"/>
    <rect x="560" y="40" width="400" height="600" rx="10" fill="#1C1712" stroke="#3B3020"/>

    <!-- header -->
    <rect x="560" y="40" width="400" height="52" rx="10" fill="#241E16"/>
    <rect x="560" y="72" width="400" height="20" fill="#241E16"/>
    <line x1="560" y1="92" x2="960" y2="92" stroke="#3B3020" stroke-width="1"/>
    <text x="586" y="72" font-family="Tahoma, Arial, sans-serif" font-size="17" font-weight="bold" fill="#C9A66B">Chess Opponent Scout</text>
    <circle cx="920" cy="66" r="3" fill="#A79C87"/>
    <circle cx="932" cy="66" r="3" fill="#A79C87"/>
    <circle cx="944" cy="66" r="3" fill="#A79C87"/>

    <!-- opponent row -->
    <text x="934" y="130" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="20" font-weight="bold" fill="#EDE6D6">MagnusFan_92</text>
    <rect x="586" y="112" width="118" height="28" rx="14" fill="rgba(176,85,74,0.18)" stroke="#B0554A"/>
    <text x="645" y="131" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="13" fill="#EDE6D6">ضائقة وقت</text>

    <!-- win/loss/draw -->
    <text x="934" y="176" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="13" fill="#A79C87">آخر 100 مباراة — الاتجاه ↗ تحسّن</text>
    <rect x="586" y="188" width="348" height="16" rx="8" fill="url(#win-loss)"/>
    <g font-family="Tahoma, Arial, sans-serif" font-size="12">
      <text x="934" y="224" text-anchor="end" fill="#7C9473">58% فوز</text>
      <text x="820" y="224" text-anchor="end" fill="#A79C87">14% تعادل</text>
      <text x="705" y="224" text-anchor="end" fill="#B0554A">28% خسارة</text>
    </g>

    <line x1="586" y1="248" x2="934" y2="248" stroke="#3B3020"/>

    <!-- openings -->
    <text x="934" y="276" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#EDE6D6">الافتتاحات</text>
    <g font-family="Tahoma, Arial, sans-serif" font-size="13">
      <rect x="586" y="288" width="348" height="34" rx="6" fill="#2C2419"/>
      <text x="924" y="309" text-anchor="end" fill="#EDE6D6">الدفاع الصقلي</text>
      <text x="600" y="309" fill="#7C9473">يفوز 71%</text>

      <rect x="586" y="330" width="348" height="34" rx="6" fill="#2C2419"/>
      <text x="924" y="351" text-anchor="end" fill="#EDE6D6">مفتتح ريتي</text>
      <text x="600" y="351" fill="#B0554A">يخسر 64%</text>
    </g>

    <line x1="586" y1="384" x2="934" y2="384" stroke="#3B3020"/>

    <!-- live clocks -->
    <text x="934" y="412" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="14" font-weight="bold" fill="#EDE6D6">الوقت المباشر</text>

    <rect x="586" y="424" width="348" height="46" rx="6" fill="#2C2419"/>
    <text x="924" y="453" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="14" fill="#A79C87">أنت</text>
    <text x="600" y="453" font-family="Georgia, serif" font-size="18" fill="#EDE6D6">04:12</text>

    <rect x="586" y="478" width="348" height="46" rx="6" fill="rgba(176,85,74,0.16)" stroke="#B0554A"/>
    <text x="924" y="507" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="14" fill="#EDE6D6">الخصم</text>
    <text x="600" y="507" font-family="Georgia, serif" font-size="18" fill="#EDE6D6">08:47</text>

    <!-- alert -->
    <rect x="586" y="540" width="348" height="52" rx="6" fill="rgba(176,85,74,0.22)" stroke="#B0554A"/>
    <text x="924" y="562" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="13" fill="#EDE6D6">وقتك أقل من الخصم</text>
    <text x="924" y="580" text-anchor="end" font-family="Tahoma, Arial, sans-serif" font-size="11" fill="#A79C87">تجاوز الحدّ المضبوط</text>
    <text x="614" y="574" text-anchor="start" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#EDE6D6">-35%</text>

    <text x="760" y="618" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="11" fill="#A79C87">اسحب من هنا لتغيير موضع اللوحة</text>
  </g>
</svg>
