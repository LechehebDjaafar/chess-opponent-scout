<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="200" fill="#15120F"/>

  <g font-family="Tahoma, Arial, sans-serif">
    <!-- تركيز عميق -->
    <g transform="translate(60,60)">
      <rect width="205" height="80" rx="10" fill="#241E16" stroke="#3B3020"/>
      <circle cx="34" cy="40" r="10" fill="#7C9473"/>
      <text x="58" y="36" font-size="16" fill="#EDE6D6">تركيز عميق</text>
      <text x="58" y="58" font-size="11" fill="#A79C87">إيقاع نقلات ثابت</text>
    </g>

    <!-- تسرّع -->
    <g transform="translate(285,60)">
      <rect width="205" height="80" rx="10" fill="#241E16" stroke="#3B3020"/>
      <circle cx="34" cy="40" r="10" fill="#C9A66B"/>
      <text x="58" y="36" font-size="16" fill="#EDE6D6">تسرّع</text>
      <text x="58" y="58" font-size="11" fill="#A79C87">نقلات أسرع من معدّله</text>
    </g>

    <!-- ضائقة وقت -->
    <g transform="translate(510,60)">
      <rect width="205" height="80" rx="10" fill="#241E16" stroke="#3B3020"/>
      <circle cx="34" cy="40" r="10" fill="#B0554A"/>
      <text x="58" y="36" font-size="16" fill="#EDE6D6">ضائقة وقت</text>
      <text x="58" y="58" font-size="11" fill="#A79C87">رصيد الوقت منخفض</text>
    </g>

    <!-- هادئ -->
    <g transform="translate(735,60)">
      <rect width="205" height="80" rx="10" fill="#241E16" stroke="#3B3020"/>
      <circle cx="34" cy="40" r="10" fill="#A79C87"/>
      <text x="58" y="36" font-size="16" fill="#EDE6D6">هادئ</text>
      <text x="58" y="58" font-size="11" fill="#A79C87">لا مؤشرات ضغط</text>
    </g>
  </g>

  <text x="500" y="175" text-anchor="middle" font-family="Tahoma, Arial, sans-serif" font-size="13" fill="#7C6C54">استنتاج إحصائي من نمط الوقت — وليس قراءة أفكار</text>
</svg>
